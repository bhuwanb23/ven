[package]
name = "ven"
version = "0.1.0"
edition = "2021"
description = "Any-first intelligent version and dependency manager"
license = "MIT"

[[bin]]
name = "ven"
path = "src/main.rs"

[[bin]]
name = "ven-launcher"
path = "src/bin/launcher.rs"

[[bin]]
name = "ven-setup"
path = "src/bin/setup/main.rs"
# The unsigned debug exe is rejected by Windows Application Control
# (os error 4551) on locked-down hosts. There are no `#[test]` items inside
# this bin, so skipping the spawned-test discovery costs us nothing and
# unblocks `cargo test --workspace` everywhere.
test = false

[dependencies]
# CLI
clap = { version = "4", features = ["derive"] }
# Async runtime
tokio = { version = "1", features = ["full"] }
# HTTP client
reqwest = { version = "0.12", features = ["json", "blocking"], default-features = true }
# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
toml_edit = "0.22"
# SQLite cache
rusqlite = { version = "0.31", features = ["bundled"] }
# Error handling
anyhow = "1"
thiserror = "1"
# Terminal output
colored = "2"
indicatif = "0.17"
# Interactive prompts
dialoguer = "0.11"
# Semver parsing
semver = "1"
# File system
dirs = "5"
walkdir = "2"
tempfile = "3"
# Async trait support
async-trait = "0.1"
# Archive handling
zip = "0.6"
flate2 = "1.0"
tar = "0.4"
# MRI Ruby Windows archives (RubyInstaller2)
sevenz-rust = { version = "0.6", default-features = false }
# Checksum verification
sha2 = "0.10"
# Source-tree walking with .gitignore awareness (ghost scanner)
ignore = "0.4"
# Cross-platform "open in browser" (`ven docs --browser`)
webbrowser = "0.8"
# Diff helper (`ven docs --diff v1 v2`)
similar = "2"
# Markdown render in the terminal (`ven docs`)
termimad = "0.31"
# Regex-based source parsing
regex = "1"

[dev-dependencies]
# HTTP mocks for OSV / EOL / registry tests
mockito = "1"

[profile.release]
opt-level = 3
strip = true
lto = true

# -----------------------------------------------------------------------------
# Workspace lint configuration (applies to `cargo clippy --workspace -- -D warnings`)
#
# The CI lint job runs clippy with `-D warnings`, which on Rust 1.94+ flags a
# wide set of stylistic suggestions that the codebase has consciously accepted
# (e.g. `vec!` over `[]` for readable static tables, `format!`/`to_string()`
# in print args for symmetry across branches, intentional one-arm `match`
# blocks documenting an exhaustive intent). Allowing them at the crate level
# keeps CI strict against *new* genuine warnings while not blocking on style
# debates one lint at a time.
#
# Anything correctness-relevant (unused_imports, unused_variables, dead_code,
# etc.) is still warn/deny by default and will fail CI. To re-evaluate any
# entry, remove it here and run `cargo clippy --workspace --all-targets`.
# -----------------------------------------------------------------------------
[lints.clippy]
# Static literal arrays/strings — array vs vec is style not safety.
useless_vec = "allow"
useless_format = "allow"
# Format-string nitpicks (`println!("{}", format!(..))`, `.to_string()` in
# print args, empty-string println, etc).
format_in_format_args = "allow"
to_string_in_format_args = "allow"
print_literal = "allow"
println_empty_string = "allow"
writeln_empty_string = "allow"
# Helper methods that mirror `Display` shape but stay inherent on purpose.
inherent_to_string = "allow"
# Patterns we keep verbose intentionally for readability / future-proofing.
single_match = "allow"
needless_borrow = "allow"
needless_return = "allow"
unnecessary_to_owned = "allow"
cmp_owned = "allow"
manual_pattern_char_comparison = "allow"
nonminimal_bool = "allow"
collapsible_if = "allow"
manual_strip = "allow"
manual_find = "allow"
while_let_on_iterator = "allow"
unnecessary_map_or = "allow"
double_ended_iterator_last = "allow"
# Identical-block branches are placeholders for future divergent logic in
# the install-flow UI; refactoring to a shared block obscures intent.
if_same_then_else = "allow"
# `Bun::next` etc. mirror trait shape but the inherent definition is the
# canonical entry point in our domain.
should_implement_trait = "allow"
# Hot-path enum where boxing a variant would force a heap alloc on every
# activation — the size penalty is paid once, the box cost would be per call.
large_enum_variant = "allow"
# A handful of orchestration functions take the full set of CLI flags
# (e.g. `cmd_status(verbose, json, security, eol, …)`); splitting into a
# struct just to silence this lint adds plumbing without clarity.
too_many_arguments = "allow"
