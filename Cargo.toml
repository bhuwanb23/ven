[package]
name = "ven"
version = "0.2.2"
edition = "2021"
description = "Any-first intelligent version and dependency manager"
license = "MIT"

[[bin]]
name = "ven"
path = "src/main.rs"

[[bin]]
name = "ven-launcher"
path = "src/bin/launcher.rs"

[[bin]]
name = "ven-setup"
path = "src/bin/setup/main.rs"
# The unsigned debug exe is rejected by Windows Application Control
# (os error 4551) on locked-down hosts. There are no `#[test]` items inside
# this bin, so skipping the spawned-test discovery costs us nothing and
# unblocks `cargo test --workspace` everywhere.
test = false

[dependencies]
# CLI
clap = { version = "4", features = ["derive"] }
# Async runtime
tokio = { version = "1", features = ["full"] }
# HTTP client
#
# Use rustls (pure-Rust TLS) instead of the default native-tls backend so:
#   1. Linux arm64 cross-compiles in the release matrix don't need a sysroot
#      with libssl-dev — see .github/workflows/release.yml. native-tls links
#      system OpenSSL, which can't be found when host=x86_64 / target=arm64
#      on the GitHub-hosted Ubuntu runner.
#   2. Every platform (Win, macOS, Linux) ships the same TLS stack for
#      reproducible behaviour.
# `rustls-tls` pulls in `rustls-tls-webpki-roots`, so trust roots ship inside
# the binary — no dependency on the host's certificate store either.
# `rustls-tls-native-roots` makes reqwest pull root CAs from the OS cert store
# in addition to webpki-roots. Without it, corporate SSL-inspecting proxies
# (Zscaler, Netskope, Bluecoat, etc.) that install their own MITM root into the
# Windows / macOS / Linux trust store cause every HTTPS request to fail —
# the browser works (it uses the OS store) but ven would not. With the feature
# enabled, reqwest merges both root pools, so we still trust Mozilla roots out
# of the box AND trust whatever an enterprise admin has added system-wide.
reqwest = { version = "0.12", default-features = false, features = ["json", "blocking", "rustls-tls", "rustls-tls-native-roots", "http2", "charset"] }
# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
toml_edit = "0.22"
# SQLite cache
rusqlite = { version = "0.31", features = ["bundled"] }
# Error handling
anyhow = "1"
# Terminal output
colored = "2"
indicatif = "0.17"
# Interactive prompts
dialoguer = "0.11"
# Semver parsing
semver = { version = "1", features = ["serde"] }
# File system
dirs = "5"
walkdir = "2"
tempfile = "3"
# Async trait support
async-trait = "0.1"
# Archive handling
zip = "0.6"
flate2 = "1.0"
tar = "0.4"
# MRI Ruby Windows archives (RubyInstaller2)
sevenz-rust = { version = "0.6", default-features = false }
# Checksum verification
sha2 = "0.10"
# Source-tree walking with .gitignore awareness (ghost scanner)
ignore = "0.4"
# Cross-platform "open in browser" (`ven docs --browser`)
webbrowser = "0.8"
# Diff helper (`ven docs --diff v1 v2`)
similar = "2"
# Markdown render in the terminal (`ven docs`)
termimad = "0.31"
# Regex-based source parsing
regex = "1"

# ── ven-setup v0.2 GUI wizard ────────────────────────────────────────────────
# All optional and gated behind the `gui` feature so a CI matrix that only
# wants the headless CLI installer (`cargo build --no-default-features
# --bin ven-setup`) skips the ~25 MB GUI surface entirely.
#
# Renderer feature picks:
#   - `default_fonts` so eframe's bundled Inter / DejaVu work cross-platform
#     without us shipping a font file.
#   - Both `glow` (OpenGL) and `wgpu` (Vulkan/Metal/DX12) backends are
#     enabled; eframe picks at runtime. On old Linux VMs with broken
#     Vulkan loaders, glow keeps the wizard alive.
#   - `wayland` + `x11` so the same Linux build runs in either session.
#   - `accesskit` for screen reader / a11y plumbing on Win/macOS.
eframe = { version = "0.28", default-features = false, features = [
    "default_fonts",
    "glow",
    "wgpu",
    "wayland",
    "x11",
    "accesskit",
], optional = true }
egui = { version = "0.28", optional = true }
egui_extras = { version = "0.28", features = ["image"], optional = true }
# PNG decoding for the embedded Ven logo on the Welcome screen.
image = { version = "0.25", default-features = false, features = ["png"], optional = true }
# Native file picker dialogs for the Storage screen's "Browse..." button.
rfd = { version = "0.15", optional = true }

# ── Windows console reattach ─────────────────────────────────────────────────
# `ven-setup.exe` ships under the *windows* subsystem (no console flash on
# double-click) but still needs to print to the parent terminal when invoked
# as `ven-setup.exe --cli ...` from PowerShell. We pull just the
# `Win32_System_Console` slice of `windows-sys` so we can call
# `AttachConsole(ATTACH_PARENT_PROCESS)`. The dependency is already in the
# transitive graph via `winit`, so the marginal cost is zero.
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.52", features = [
    "Win32_Foundation",
    "Win32_System_Console",
] }

[dev-dependencies]
# HTTP mocks for OSV / EOL / registry tests
mockito = "1"

[build-dependencies]
sha2 = "0.10"

# ── Features ─────────────────────────────────────────────────────────────────
# `gui` is on by default so a vanilla `cargo build` produces a wizard-capable
# `ven-setup`. CI builds that only need the CLI installer can opt out with
# `cargo build --no-default-features --bin ven-setup`, which drops the eframe
# / wgpu / glow / rfd graph and shrinks the binary by ~20 MB.
[features]
default = ["gui"]
gui = ["dep:eframe", "dep:egui", "dep:egui_extras", "dep:image", "dep:rfd"]

[profile.release]
opt-level = 3
strip = true
lto = true

# -----------------------------------------------------------------------------
# Workspace lint configuration (applies to `cargo clippy --workspace -- -D warnings`)
#
# The CI lint job runs clippy with `-D warnings`, which on Rust 1.94+ flags a
# wide set of stylistic suggestions that the codebase has consciously accepted
# (e.g. `vec!` over `[]` for readable static tables, `format!`/`to_string()`
# in print args for symmetry across branches, intentional one-arm `match`
# blocks documenting an exhaustive intent). Allowing them at the crate level
# keeps CI strict against *new* genuine warnings while not blocking on style
# debates one lint at a time.
#
# Anything correctness-relevant (unused_imports, unused_variables, dead_code,
# etc.) is still warn/deny by default and will fail CI. To re-evaluate any
# entry, remove it here and run `cargo clippy --workspace --all-targets`.
# -----------------------------------------------------------------------------
[lints.clippy]
# Static literal arrays/strings — array vs vec is style not safety.
useless_vec = "allow"
useless_format = "allow"
# Format-string nitpicks (`println!("{}", format!(..))`, `.to_string()` in
# print args, empty-string println, etc).
format_in_format_args = "allow"
to_string_in_format_args = "allow"
print_literal = "allow"
println_empty_string = "allow"
writeln_empty_string = "allow"
# Helper methods that mirror `Display` shape but stay inherent on purpose.
inherent_to_string = "allow"
# Patterns we keep verbose intentionally for readability / future-proofing.
single_match = "allow"
needless_borrow = "allow"
needless_return = "allow"
unnecessary_to_owned = "allow"
cmp_owned = "allow"
manual_pattern_char_comparison = "allow"
nonminimal_bool = "allow"
collapsible_if = "allow"
manual_strip = "allow"
manual_find = "allow"
while_let_on_iterator = "allow"
unnecessary_map_or = "allow"
double_ended_iterator_last = "allow"
# Identical-block branches are placeholders for future divergent logic in
# the install-flow UI; refactoring to a shared block obscures intent.
if_same_then_else = "allow"
# `Bun::next` etc. mirror trait shape but the inherent definition is the
# canonical entry point in our domain.
should_implement_trait = "allow"
# Hot-path enum where boxing a variant would force a heap alloc on every
# activation — the size penalty is paid once, the box cost would be per call.
large_enum_variant = "allow"
# A handful of orchestration functions take the full set of CLI flags
# (e.g. `cmd_status(verbose, json, security, eol, …)`); splitting into a
# struct just to silence this lint adds plumbing without clarity.
too_many_arguments = "allow"
