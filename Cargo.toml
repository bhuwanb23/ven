[package]
name = "ven"
version = "0.1.0"
edition = "2021"
description = "Any-first intelligent version and dependency manager"
license = "MIT"

[[bin]]
name = "ven"
path = "src/main.rs"

[dependencies]
# CLI
clap = { version = "4", features = ["derive"] }
# Async runtime
tokio = { version = "1", features = ["full"] }
# HTTP client
reqwest = { version = "0.12", features = ["json", "blocking"] }
# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
toml_edit = "0.22"
# SQLite cache
rusqlite = { version = "0.31", features = ["bundled"] }
# Error handling
anyhow = "1"
thiserror = "1"
# Terminal output
colored = "2"
indicatif = "0.17"
# Interactive prompts
dialoguer = "0.11"
# Semver parsing
semver = "1"
# File system
dirs = "5"
walkdir = "2"
# Async trait support
async-trait = "0.1"
# Archive handling
zip = "0.6"
flate2 = "1.0"
tar = "0.4"
# Checksum verification
sha2 = "0.10"

[profile.release]
opt-level = 3
strip = true
lto = true

[dev-dependencies]
tempfile = "3.27.0"
